name: Simplify results comparison UI

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/simplify-results-ui.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Apply results UI patch
        run: python scripts/simplify_results_ui.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/simplify-results-ui.yml scripts/simplify_results_ui.py
          git add index.html
          git commit -m "feat: simplify cost comparison results"
          git push
