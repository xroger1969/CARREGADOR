name: Apply total fuel cost result

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-total-fuel-cost.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Add total fuel cost and total savings
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          lines = path.read_text(encoding='utf-8').splitlines()

          calc_anchor = '      const custoCombustaoKm = custoCombustao100 / 100;'
          calc_line_1 = '      const custoCombustaoTotal = custoCombustaoKm * autonomiaAdicionada;'
          calc_line_2 = '      const poupancaTotal = custoCombustaoTotal - custoCarga;'
          if calc_line_1 not in lines:
              i = lines.index(calc_anchor) + 1
              lines[i:i] = [calc_line_1, calc_line_2]

          old_label = '          <div class="box"><div class="muted">Custo da carga</div><div class="big">${formatCurrency(custoCarga)}</div></div>'
          new_label = '          <div class="box"><div class="muted">Custo elétrico total</div><div class="big">${formatCurrency(custoCarga)}</div></div>'
          if old_label in lines:
              lines[lines.index(old_label)] = new_label

          result_anchor = '          <div class="box"><div class="muted">Diferença</div><div class="big">${formatNumber(percentagemPoupanca, 1)}%</div></div>'
          total_fuel_box = '          <div class="box"><div class="muted">Combustível / ${formatNumber(autonomiaAdicionada, 0)} km</div><div class="big">${formatCurrency(custoCombustaoTotal)}</div></div>'
          total_saving_box = '          <div class="box"><div class="muted">Poupança total</div><div class="big">${formatCurrency(poupancaTotal)}</div></div>'
          if total_fuel_box not in lines:
              i = lines.index(result_anchor) + 1
              lines[i:i] = [total_fuel_box, total_saving_box]

          path.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY

      - name: Commit change and remove one-time workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-total-fuel-cost.yml
          git add index.html
          git commit -m "feat: show total fuel cost for equivalent range"
          git push
